[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.modules.hr" = ["assets/*.ttf", "assets/*.txt"]

[project]
name = "mi-leapmetrics-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.151.0", "uvicorn==0.54.0", "SQLAlchemy==2.1.5",
  "alembic==1.20.0", "pydantic==2.14.1", "pydantic-settings==2.16.0",
  "openpyxl==3.1.5", "reportlab==5.0.1", "defusedxml==0.7.1",
  "PyMySQL[rsa]==1.2.3", "argon2-cffi==25.1.0", "email-validator>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx2==2.15.1", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["mysql: requires an isolated MySQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

