name: mycareer
services:
  db:
    image: mysql:8.4.11@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
    restart: unless-stopped
    # MySQL 8.4 enables binary logging by default; the initial migration creates
    # reviewed audit triggers using the scoped application database account.
    command: ["--log-bin-trust-function-creators=ON"]
    environment:
      MYSQL_DATABASE: ${MI_DATABASE_NAME:?Set MI_DATABASE_NAME to the existing database name}
      MYSQL_USER: ${MI_DATABASE_USER:?Set MI_DATABASE_USER to the existing database user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    image: mycareer-app:1.1
    restart: "no"
    environment:
      MI_ENVIRONMENT: production
      MI_DATABASE_URL: mysql+pymysql://${MI_DATABASE_USER:?Set MI_DATABASE_USER}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@db:3306/${MI_DATABASE_NAME:?Set MI_DATABASE_NAME}?charset=utf8mb4
      MI_SECRET_KEY: ${MI_SECRET_KEY:?Set MI_SECRET_KEY}
      MI_ALLOWED_ORIGINS: '${MI_ALLOWED_ORIGINS:?Set MI_ALLOWED_ORIGINS to a JSON array containing the app origin}'
      MI_COOKIE_SECURE: ${MI_COOKIE_SECURE:-true}
      MI_ALLOW_INSECURE_HTTP: ${MI_ALLOW_INSECURE_HTTP:-false}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  app:
    image: mycareer-app:1.1
    restart: unless-stopped
    environment:
      MI_ENVIRONMENT: production
      MI_DATABASE_URL: mysql+pymysql://${MI_DATABASE_USER:?Set MI_DATABASE_USER}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@db:3306/${MI_DATABASE_NAME:?Set MI_DATABASE_NAME}?charset=utf8mb4
      MI_SECRET_KEY: ${MI_SECRET_KEY:?Set MI_SECRET_KEY}
      MI_ALLOWED_ORIGINS: '${MI_ALLOWED_ORIGINS:?Set MI_ALLOWED_ORIGINS to a JSON array containing the app origin}'
      MI_COOKIE_SECURE: ${MI_COOKIE_SECURE:-true}
      MI_ALLOW_INSECURE_HTTP: ${MI_ALLOW_INSECURE_HTTP:-false}
      MI_ATTACHMENT_DIRECTORY: /srv/storage/appraisal-attachments
      MI_MAIL_ENABLED: ${MI_MAIL_ENABLED:-false}
      MI_MAIL_TEST_MODE: ${MI_MAIL_TEST_MODE:-true}
      MI_MAIL_TEST_RECIPIENT: ${MI_MAIL_TEST_RECIPIENT:-}
      MI_MAIL_FROM_ADDRESS: ${MI_MAIL_FROM_ADDRESS:-}
      MI_MAIL_FROM_NAME: ${MI_MAIL_FROM_NAME:-MyCareer}
      MI_SMTP_HOST: ${MI_SMTP_HOST:-}
      MI_SMTP_PORT: ${MI_SMTP_PORT:-587}
      MI_SMTP_USERNAME: ${MI_SMTP_USERNAME:-}
      MI_SMTP_PASSWORD: ${MI_SMTP_PASSWORD:-}
      MI_SMTP_STARTTLS: ${MI_SMTP_STARTTLS:-true}
      MI_PUBLIC_BASE_URL: ${MI_PUBLIC_BASE_URL:-}
      MI_SETUP_LINK_MINUTES: ${MI_SETUP_LINK_MINUTES:-10080}
    ports:
      - "${MI_HOST_PORT:-8080}:8000"
    volumes:
      - attachments:/srv/storage/appraisal-attachments
    depends_on:
      db:
        condition: service_healthy

volumes:
  database:
    # Require an explicit existing/new volume name. This prevents a project-name
    # change from silently creating a second, empty database during upgrades.
    external: true
    name: ${MI_DATABASE_VOLUME:?Set MI_DATABASE_VOLUME to the existing database volume name}
  attachments:
    external: true
    name: ${MI_ATTACHMENTS_VOLUME:?Set MI_ATTACHMENTS_VOLUME to the existing attachments volume name}
