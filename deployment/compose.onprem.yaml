name: mycareer
services:
  db:
    image: mysql:8.4.11@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mycareer
      MYSQL_USER: mycareer
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    image: mycareer-app:1.1
    restart: "no"
    environment:
      MI_ENVIRONMENT: production
      MI_DATABASE_URL: mysql+pymysql://mycareer:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@db:3306/mycareer?charset=utf8mb4
      MI_SECRET_KEY: ${MI_SECRET_KEY:?Set MI_SECRET_KEY}
      MI_ALLOWED_ORIGINS: '${MI_ALLOWED_ORIGINS:?Set MI_ALLOWED_ORIGINS to a JSON array containing the public HTTPS origin}'
      MI_COOKIE_SECURE: "true"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  app:
    image: mycareer-app:1.1
    restart: unless-stopped
    environment:
      MI_ENVIRONMENT: production
      MI_DATABASE_URL: mysql+pymysql://mycareer:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@db:3306/mycareer?charset=utf8mb4
      MI_SECRET_KEY: ${MI_SECRET_KEY:?Set MI_SECRET_KEY}
      MI_ALLOWED_ORIGINS: '${MI_ALLOWED_ORIGINS:?Set MI_ALLOWED_ORIGINS to a JSON array containing the public HTTPS origin}'
      MI_COOKIE_SECURE: "true"
      MI_ATTACHMENT_DIRECTORY: /srv/storage/appraisal-attachments
      MI_MAIL_ENABLED: ${MI_MAIL_ENABLED:-false}
      MI_MAIL_TEST_MODE: ${MI_MAIL_TEST_MODE:-true}
      MI_MAIL_TEST_RECIPIENT: ${MI_MAIL_TEST_RECIPIENT:-}
      MI_MAIL_FROM_ADDRESS: ${MI_MAIL_FROM_ADDRESS:-}
      MI_MAIL_FROM_NAME: ${MI_MAIL_FROM_NAME:-MyCareer}
      MI_SMTP_HOST: ${MI_SMTP_HOST:-}
      MI_SMTP_PORT: ${MI_SMTP_PORT:-587}
      MI_SMTP_USERNAME: ${MI_SMTP_USERNAME:-}
      MI_SMTP_PASSWORD: ${MI_SMTP_PASSWORD:-}
      MI_SMTP_STARTTLS: ${MI_SMTP_STARTTLS:-true}
      MI_PUBLIC_BASE_URL: ${MI_PUBLIC_BASE_URL:-}
      MI_SETUP_LINK_MINUTES: ${MI_SETUP_LINK_MINUTES:-1440}
    ports:
      - "8080:8000"
    volumes:
      - attachments:/srv/storage/appraisal-attachments
    depends_on:
      db:
        condition: service_healthy

volumes:
  database:
  attachments:
