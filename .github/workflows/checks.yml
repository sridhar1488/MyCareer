name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
        env:
          MYSQL_ROOT_PASSWORD: ci-isolated-test-only
          MYSQL_DATABASE: leapmetrics_test
          MYSQL_ROOT_HOST: '%'
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-isolated-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MI_DATABASE_URL: mysql+pymysql://root:ci-isolated-test-only@127.0.0.1:3306/leapmetrics_test
      MI_TEST_DATABASE_URL: mysql+pymysql://root:ci-isolated-test-only@127.0.0.1:3306/leapmetrics_test
      MI_SECRET_KEY: ci-only-secret-for-disposable-test-database
      MI_ENVIRONMENT: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.lock
      - run: ruff check app tests tools migrations
      - run: ruff format --check app tests tools migrations
      - run: pytest -q
      - run: alembic check
      - run: python -m tools.export_openapi
      - run: git diff --exit-code -- ../docs/openapi.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:types
      - run: git diff --exit-code -- src/api/schema.d.ts
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
  browser:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
        env:
          MYSQL_ROOT_PASSWORD: ci-isolated-test-only
          MYSQL_DATABASE: leapmetrics_e2e_test
          MYSQL_ROOT_HOST: '%'
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-isolated-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MI_E2E_DATABASE_URL: mysql+pymysql://root:ci-isolated-test-only@127.0.0.1:3306/leapmetrics_e2e_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install -r backend/requirements-dev.lock
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend
